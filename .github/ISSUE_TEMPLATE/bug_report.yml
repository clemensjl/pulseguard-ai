name: Bug report
description: Something in PulseGuard AI does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Page, clicks and any URL you entered into the checker
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
